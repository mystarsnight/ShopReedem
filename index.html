<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mystarsnight Redeemed</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
    margin: 0;
    font-family: Arial;
    text-align: center;
    background: linear-gradient(45deg, #ff00cc, #3333ff, #00ffcc);
    color: white;
}

.box {
    margin-top: 120px;
}

input, button {
    padding: 10px;
    border-radius: 10px;
    border: none;
    font-size: 16px;
}

button {
    cursor: pointer;
    background: #00ffcc;
    font-weight: bold;
}

/* FULLSCREEN REWARD OVERLAY */
#rewardScreen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: black;
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    animation: fadeIn 0.4s ease;
}

@keyframes fadeIn {
    from { opacity: 0; transform: scale(1.1); }
    to { opacity: 1; transform: scale(1); }
}

/* hide everything inside main UI when reward shows */
.hidden {
    display: none;
}
</style>
</head>

<body>

<div class="box" id="mainUI">
    <h1>Mystarsnight Redeemed</h1>

    <input id="codeInput" placeholder="Enter Code">
    <br><br>

    <button id="redeemBtn">Redeem</button>
</div>

<!-- FULLSCREEN REWARD -->
<div id="rewardScreen"></div>

<script>
const supabaseClient = window.supabase.createClient(
  "https://ibcjgxaryayuqjqulzbw.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImliY2pneGFyeWF5dXFqcXVsemJ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0OTc4NjEsImV4cCI6MjA5MzA3Mzg2MX0.7TacUyZlV8Bepp6oSAT_jdv1Tuld8iQsipRPrSlHPgY"
);

const mainUI = document.getElementById("mainUI");
const rewardScreen = document.getElementById("rewardScreen");

function showReward(html) {
    // hide UI completely
    mainUI.style.display = "none";

    // show fullscreen reward
    rewardScreen.innerHTML = html || "<h1 style='color:white'>No reward</h1>";
    rewardScreen.style.display = "flex";
}

document.getElementById("redeemBtn").addEventListener("click", async () => {
    try {
        const code = document.getElementById("codeInput").value.trim();

        if (!code) return;

        const { data, error } = await supabaseClient
            .from("codes")
            .select("*")
            .eq("code", code);

        if (error) return;

        const row = data?.[0];
        if (!row) return;

        if (row.uses >= row.maxuses) return;

        await supabaseClient
            .from("codes")
            .update({ uses: row.uses + 1 })
            .eq("id", row.id);

        // 🔥 FULLSCREEN REWARD
        showReward(row.html);

    } catch (err) {
        console.error(err);
    }
});
</script>

<link rel="icon" href="data:,">

</body>
</html>
